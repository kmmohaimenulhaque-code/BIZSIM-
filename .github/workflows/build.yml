name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then npm run dist:win; fi
          if [ "${{ runner.os }}" = "macOS" ]; then npm run dist:mac; fi
          if [ "${{ runner.os }}" = "Linux" ]; then npm run dist:linux; fi
        shell: bash
